name: Compilar SQ-16

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Compilar
        run: cmake --build build --config Release --parallel 4

      # En Mac se empaqueta en .zip con ditto para no perder los permisos del programa
      - name: Empaquetar (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/SQ16_artefacts/Release/Standalone/SQ-16.app dist/SQ-16-Standalone-Mac.zip
          ditto -c -k --keepParent build/SQ16_artefacts/Release/VST3/SQ-16.vst3 dist/SQ-16-VST3-Mac.zip

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          Copy-Item -Recurse build/SQ16_artefacts/Release/Standalone/* dist/
          Copy-Item -Recurse build/SQ16_artefacts/Release/VST3/* dist/

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: SQ-16-${{ runner.os }}
          path: dist

  # Publica los programas en la pagina "Releases" para descargarlos con un clic
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Preparar archivos
        run: |
          (cd art/SQ-16-Windows && zip -r ../../SQ-16-Windows.zip .)
          cp art/SQ-16-macOS/*.zip .
          ls -la *.zip

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create ultima-version *.zip -R ${{ github.repository }} --target ${{ github.sha }} \
            --title "SQ-16 (ultima version)" --notes "Version compilada automaticamente desde main."
